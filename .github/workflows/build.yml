name: Build GTA SA release

on:
  push:
    branches: [ perf-experiments ]
  workflow_dispatch:
    inputs:
      mesa_sdk_url:
        description: 'URL of the Mesa 26.2 unified Horizon SDK zip (empty = the 26.2.4 SDK below).'
        required: false
        type: string
      mesa_sdk_sha256:
        description: 'SHA-256 of that zip (empty = the 26.2.4 SDK below).'
        required: false
        type: string
      version:
        description: 'Release version. Leave it empty to avoid publishing a release.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required Switch libraries
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 \
            switch-sdl2_image \
            switch-mpg123 \
            switch-ffmpeg \
            switch-openal-soft \
            switch-libexpat \
            switch-libzstd \
            switch-zlib

      - name: Stage unified Mesa SDK
        # Default: danfromtico/mesa-switch 606441c9 (Mesa 26.2.4) unified SDK,
        # kept unchanged as a release asset by aeon1911/RDoom-NX because the
        # original CI artifact expires. Pushes have no inputs, so they use it too.
        env:
          MESA_SDK_URL: ${{ inputs.mesa_sdk_url || 'https://github.com/aeon1911/RDoom-NX/releases/download/deps-mesa-26.2.4-606441c9/mesa-26.2.4-switch-unified-horizon-sdk-606441c9.zip' }}
          MESA_SDK_SHA256: ${{ inputs.mesa_sdk_sha256 || '937cbda82d411c3ca909aa977b3ced82d4e6070046ab016911b1ce84e58ca392' }}
        run: |
          curl --fail --location --retry 3 "$MESA_SDK_URL" --output /tmp/mesa-sdk.zip
          echo "$MESA_SDK_SHA256 */tmp/mesa-sdk.zip" | sha256sum --check --strict
          mkdir -p mesa-install
          python3 -m zipfile -e /tmp/mesa-sdk.zip mesa-install
          test -f mesa-install/opt/devkitpro/portlibs/switch/lib/libEGL.a
          test -f mesa-install/opt/devkitpro/portlibs/switch/lib/libGLESv2.a

      - name: List SDK and portlib archives
        shell: bash
        run: |
          sdk=$(ls mesa-install/opt/devkitpro/portlibs/switch/lib | tr '\n' ' ')
          ports=$(ls /opt/devkitpro/portlibs/switch/lib | grep -E '\.a$' | tr '\n' ' ')
          echo "::notice title=Mesa SDK libs::$sdk"
          echo "::notice title=Portlibs::$ports"

      # Build output is also surfaced as annotations, so failures can be read
      # from the check-run API without downloading the raw job log.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! make 2>&1 | tee build.log; then
            esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            errs=$(grep -E 'error|undefined reference|cannot find|multiple definition|\*\*\*' build.log | head -60 | esc)
            tail=$(tail -n 40 build.log | esc)
            echo "::error title=Build errors::$errs"
            echo "::error title=Build log tail::$tail"
            exit 1
          fi
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtasa_nx
          path: gtasa_nx.nro
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gtasa_nx

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "gtasa_nx v${{ inputs.version }}"
          files: gtasa_nx.nro
          draft: false
          prerelease: false
